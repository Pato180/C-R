<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Nuestra historia</title>


    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0512;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }


        /* =========================
           AVISO DE GIRAR PANTALLA
           ========================= */

        #aviso-orientacion {

            position: fixed;
            inset: 0;

            display: none;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 28px;

            padding: 30px;

            background:
                radial-gradient(
                    circle at center,
                    #211232 0%,
                    #0a0512 70%
                );

            color: #f4eafa;

            text-align: center;

            z-index: 9999;
        }


        /* =========================
           TELÉFONO ANIMADO
           ========================= */

        .telefono-contenedor {

            width: 90px;
            height: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            animation: girar-telefono 2.5s ease-in-out infinite;
        }


        .telefono {

            width: 58px;
            height: 100px;

            border: 3px solid #a06fd6;
            border-radius: 12px;

            position: relative;

            box-shadow:
                0 0 15px rgba(160, 111, 214, 0.5),
                inset 0 0 10px rgba(160, 111, 214, 0.15);
        }


        .telefono::before {

            content: "";

            position: absolute;

            top: 7px;
            left: 50%;

            transform: translateX(-50%);

            width: 18px;
            height: 4px;

            border-radius: 10px;

            background: #a06fd6;
        }


        .telefono::after {

            content: "";

            position: absolute;

            bottom: 7px;
            left: 50%;

            transform: translateX(-50%);

            width: 7px;
            height: 7px;

            border-radius: 50%;

            border: 1px solid #a06fd6;
        }


        @keyframes girar-telefono {

            0% {
                transform: rotate(0deg);
            }

            35% {
                transform: rotate(0deg);
            }

            65% {
                transform: rotate(90deg);
            }

            100% {
                transform: rotate(90deg);
            }

        }


        /* =========================
           TEXTO
           ========================= */

        .titulo-orientacion {

            font-size: clamp(22px, 6vw, 32px);

            font-weight: bold;

            letter-spacing: 1px;

            color: #ffffff;
        }


        .subtitulo-orientacion {

            margin-top: 8px;

            font-size: clamp(14px, 4vw, 18px);

            line-height: 1.5;

            color: rgba(244, 234, 250, 0.65);
        }


        /* =========================
           CONTENIDO PRINCIPAL
           ========================= */

        #contenido {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* =========================
           GIFS
           ========================= */

        .gif-inicio {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            object-fit: contain;

            background: #0a0512;

            display: none;

            z-index: 5000;
        }


        /* =========================
           ZONAS INTERACTIVAS
           ========================= */

        .zona-interactiva {

            position: fixed;

            display: none;

            z-index: 6000;

            cursor: pointer;

            /*
            IMPORTANTE:

            Estas zonas son transparentes.
            No modifican la apariencia del GIF.
            */

            background: transparent;

            border: none;

            padding: 0;

            -webkit-tap-highlight-color: transparent;
        }


        /* =========================
           BOTÓN INICIAR PARTIDA
           ========================= */

        #zona-iniciar {

            width: 35vw;
            height: 12vh;

            left: 32.5vw;
            top: 58vh;
        }


        /* =========================
           BOTÓN SALIR
           ========================= */

        #zona-salir {

            width: 25vw;
            height: 10vh;

            left: 37.5vw;
            top: 72vh;
        }


        /* =========================
           BOTÓN VOLVER AL INICIO
           ========================= */

        #zona-volver {

            width: 40vw;
            height: 12vh;

            left: 30vw;
            top: 75vh;
        }


        /* =========================
           CELULAR VERTICAL
           ========================= */

        @media (orientation: portrait) and (max-width: 900px) {

            #aviso-orientacion {
                display: flex;
            }

            #contenido {
                display: none;
            }

        }


        /* =========================
           PANTALLA HORIZONTAL
           ========================= */

        @media (orientation: landscape) {

            #aviso-orientacion {
                display: none;
            }

            #contenido {
                display: flex;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         AVISO DE GIRAR PANTALLA
         ===================================== -->

    <div id="aviso-orientacion">

        <div class="telefono-contenedor">

            <div class="telefono"></div>

        </div>


        <div>

            <div class="titulo-orientacion">
                Gira tu pantalla
            </div>

            <div class="subtitulo-orientacion">
                para comenzar nuestra historia
            </div>

        </div>

    </div>


    <!-- =====================================
         CONTENIDO PRINCIPAL
         ===================================== -->

    <div id="contenido"></div>


    <!-- =====================================
         GIF 1
         ===================================== -->

    <img
        id="gif-1"
        class="gif-inicio"
        src="./img/1-.gif"
        alt="Nuestra historia"
    >


    <!-- =====================================
         GIF 2
         ===================================== -->

    <img
        id="gif-2"
        class="gif-inicio"
        src="./img/2-.gif"
        alt="Nuestra historia"
    >


    <!-- =====================================
         GIF 3
         ===================================== -->

    <img
        id="gif-3"
        class="gif-inicio"
        src="./img/3-.gif"
        alt="Volver al inicio"
    >


    <!-- =====================================
         GIF 4
         ===================================== -->

    <img
        id="gif-4"
        class="gif-inicio"
        src="./img/4-.gif"
        alt="Iniciar partida"
    >


    <!-- =====================================
         ZONAS INTERACTIVAS
         ===================================== -->

    <button
        id="zona-iniciar"
        class="zona-interactiva"
        aria-label="Iniciar partida">
    </button>


    <button
        id="zona-salir"
        class="zona-interactiva"
        aria-label="Salir">
    </button>


    <button
        id="zona-volver"
        class="zona-interactiva"
        aria-label="Volver al inicio">
    </button>


    <!-- =====================================
         JAVASCRIPT
         ===================================== -->

    <script>

        /* =========================
           OBTENER ELEMENTOS
           ========================= */

        const gif1 = document.getElementById("gif-1");
        const gif2 = document.getElementById("gif-2");
        const gif3 = document.getElementById("gif-3");
        const gif4 = document.getElementById("gif-4");

        const zonaIniciar = document.getElementById("zona-iniciar");
        const zonaSalir = document.getElementById("zona-salir");
        const zonaVolver = document.getElementById("zona-volver");


        let inicioMostrado = false;


        /* =====================================
           COMPROBAR SI ESTÁ HORIZONTAL
           ===================================== */

        function estaHorizontal() {

            return window.matchMedia(
                "(orientation: landscape)"
            ).matches;

        }


        /* =====================================
           OCULTAR TODAS LAS ESCENAS
           ===================================== */

        function ocultarTodo() {

            gif1.style.display = "none";
            gif2.style.display = "none";
            gif3.style.display = "none";
            gif4.style.display = "none";

            zonaIniciar.style.display = "none";
            zonaSalir.style.display = "none";
            zonaVolver.style.display = "none";

        }


        /* =====================================
           MOSTRAR GIF 2
           ===================================== */

        function mostrarGif2() {

            ocultarTodo();

            gif2.style.display = "block";

            zonaIniciar.style.display = "block";
            zonaSalir.style.display = "block";

        }


        /* =====================================
           MOSTRAR GIF 3
           ===================================== */

        function mostrarGif3() {

            ocultarTodo();

            gif3.style.display = "block";

            zonaVolver.style.display = "block";

        }


        /* =====================================
           MOSTRAR GIF 4
           ===================================== */

        function mostrarGif4() {

            ocultarTodo();

            gif4.style.display = "block";

        }


        /* =====================================
           INICIAR HISTORIA
           ===================================== */

        function iniciarHistoria() {

            if (!estaHorizontal()) {
                return;
            }

            if (inicioMostrado) {
                return;
            }

            inicioMostrado = true;


            /* =========================
               MOSTRAR GIF 1
               ========================= */

            ocultarTodo();

            gif1.style.display = "block";


            /* =========================
               DESPUÉS DE 7 SEGUNDOS
               ========================= */

            setTimeout(function() {

                mostrarGif2();

            }, 7000);

        }


        /* =====================================
           INICIAR PARTIDA
           ===================================== */

        zonaIniciar.addEventListener(
            "click",
            function() {

                mostrarGif4();

            }
        );


        /* =====================================
           SALIR
           ===================================== */

        zonaSalir.addEventListener(
            "click",
            function() {

                mostrarGif3();

            }
        );


        /* =====================================
           VOLVER AL INICIO
           ===================================== */

        zonaVolver.addEventListener(
            "click",
            function() {

                mostrarGif2();

            }
        );


        /* =====================================
           COMPROBAR AL CARGAR
           ===================================== */

        iniciarHistoria();


        /* =====================================
           CAMBIO DE ORIENTACIÓN
           ===================================== */

        window.addEventListener(
            "orientationchange",
            function() {

                setTimeout(
                    iniciarHistoria,
                    300
                );

            }
        );


        /* =====================================
           CAMBIO DE TAMAÑO
           ===================================== */

        window.addEventListener(
            "resize",
            function() {

                setTimeout(
                    iniciarHistoria,
                    300
                );

            }
        );


    </script>


</body>

</html>
