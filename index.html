<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Nuestra historia</title>


    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0512;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }


        /* =========================
           AVISO DE GIRAR PANTALLA
           ========================= */

        #aviso-orientacion {

            position: fixed;
            inset: 0;

            display: none;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 28px;

            padding: 30px;

            background:
                radial-gradient(
                    circle at center,
                    #211232 0%,
                    #0a0512 70%
                );

            color: #f4eafa;

            text-align: center;

            z-index: 9999;
        }


        /* =========================
           TELÉFONO ANIMADO
           ========================= */

        .telefono-contenedor {

            width: 90px;
            height: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            animation: girar-telefono 2.5s ease-in-out infinite;
        }


        .telefono {

            width: 58px;
            height: 100px;

            border: 3px solid #a06fd6;
            border-radius: 12px;

            position: relative;

            box-shadow:
                0 0 15px rgba(160, 111, 214, 0.5),
                inset 0 0 10px rgba(160, 111, 214, 0.15);
        }


        .telefono::before {

            content: "";

            position: absolute;

            top: 7px;
            left: 50%;

            transform: translateX(-50%);

            width: 18px;
            height: 4px;

            border-radius: 10px;

            background: #a06fd6;
        }


        .telefono::after {

            content: "";

            position: absolute;

            bottom: 7px;
            left: 50%;

            transform: translateX(-50%);

            width: 7px;
            height: 7px;

            border-radius: 50%;

            border: 1px solid #a06fd6;
        }


        @keyframes girar-telefono {

            0% {
                transform: rotate(0deg);
            }

            35% {
                transform: rotate(0deg);
            }

            65% {
                transform: rotate(90deg);
            }

            100% {
                transform: rotate(90deg);
            }

        }


        /* =========================
           TEXTO ORIENTACIÓN
           ========================= */

        .titulo-orientacion {

            font-size: clamp(22px, 6vw, 32px);

            font-weight: bold;

            letter-spacing: 1px;

            color: #ffffff;
        }


        .subtitulo-orientacion {

            margin-top: 8px;

            font-size: clamp(14px, 4vw, 18px);

            line-height: 1.5;

            color: rgba(244, 234, 250, 0.65);
        }


        /* =========================
           CONTENIDO PRINCIPAL
           ========================= */

        #contenido {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* =========================
           CONTENEDORES DE GIFS
           ========================= */

        .gif-contenedor {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            display: none;

            z-index: 5000;

            background: #0a0512;
        }

        .gif-inicio {

            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /* =========================
           ZONAS INTERACTIVAS (BOTONES INVISIBLES)
           ========================= */

        .btn-zona {
            position: absolute;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 6000;
            outline: none;
        }

        /* Posicionamiento para las opciones de 2-.gif */
        #btn-iniciar {
            top: 61%;
            left: 36%;
            width: 28%;
            height: 6%;
        }

        #btn-salir {
            top: 68%;
            left: 36%;
            width: 28%;
            height: 6%;
        }

        /* Posicionamiento para la opción de 3-.gif */
        #btn-volver {
            top: 58%;
            left: 26%;
            width: 30%;
            height: 7%;
        }


        /* =========================
           CELULAR VERTICAL
           ========================= */

        @media (orientation: portrait) and (max-width: 900px) {

            #aviso-orientacion {
                display: flex;
            }

            #contenido {
                display: none;
            }

        }


        /* =========================
           PANTALLA HORIZONTAL
           ========================= */

        @media (orientation: landscape) {

            #aviso-orientacion {
                display: none;
            }

            #contenido {
                display: flex;
            }

        }

    </style>

</head>


<body>


    <div id="aviso-orientacion">

        <div class="telefono-contenedor">

            <div class="telefono"></div>

        </div>


        <div>

            <div class="titulo-orientacion">
                Gira tu pantalla
            </div>

            <div class="subtitulo-orientacion">
                para comenzar nuestra historia
            </div>

        </div>

    </div>


    <div id="contenido"></div>


    <div id="contenedor-gif-1" class="gif-contenedor">
        <img class="gif-inicio" src="./img/1-.gif" alt="Nuestra historia">
    </div>


    <div id="contenedor-gif-2" class="gif-contenedor">
        <img class="gif-inicio" src="./img/2-.gif" alt="Menú principal">
        <button id="btn-iniciar" class="btn-zona" aria-label="Iniciar Partida"></button>
        <button id="btn-salir" class="btn-zona" aria-label="Salir"></button>
    </div>


    <div id="contenedor-gif-3" class="gif-contenedor">
        <img class="gif-inicio" src="./img/3-.gif" alt="Pantalla de salida">
        <button id="btn-volver" class="btn-zona" aria-label="Volver al inicio"></button>
    </div>


    <div id="contenedor-gif-4" class="gif-contenedor">
        <img class="gif-inicio" src="./img/4-.gif" alt="Partida iniciada">
    </div>


    <script>

        const contenedorGif1 = document.getElementById("contenedor-gif-1");
        const contenedorGif2 = document.getElementById("contenedor-gif-2");
        const contenedorGif3 = document.getElementById("contenedor-gif-3");
        const contenedorGif4 = document.getElementById("contenedor-gif-4");

        const btnIniciar = document.getElementById("btn-iniciar");
        const btnSalir = document.getElementById("btn-salir");
        const btnVolver = document.getElementById("btn-volver");

        let inicioMostrado = false;


        function estaHorizontal() {

            return window.matchMedia(
                "(orientation: landscape)"
            ).matches;

        }


        function ocultarTodosLosGifs() {
            contenedorGif1.style.display = "none";
            contenedorGif2.style.display = "none";
            contenedorGif3.style.display = "none";
            contenedorGif4.style.display = "none";
        }


        function iniciarHistoria() {

            if (!estaHorizontal()) {
                return;
            }

            if (inicioMostrado) {
                return;
            }

            inicioMostrado = true;

            // Mostrar GIF 1
            ocultarTodosLosGifs();
            contenedorGif1.style.display = "block";

            // Transición al GIF 2 a los 7 segundos
            setTimeout(function() {
                ocultarTodosLosGifs();
                contenedorGif2.style.display = "block";
            }, 7000);

        }


        /* =====================================
           EVENTOS DE NAVEGACIÓN
           ===================================== */

        // Al hacer clic en INICIAR PARTIDA -> Ir a 4-.gif
        btnIniciar.addEventListener("click", function() {
            ocultarTodosLosGifs();
            contenedorGif4.style.display = "block";
        });

        // Al hacer clic en SALIR -> Ir a 3-.gif
        btnSalir.addEventListener("click", function() {
            ocultarTodosLosGifs();
            contenedorGif3.style.display = "block";
        });

        // Al hacer clic en VOLVER AL INICIO -> Regresar a 2-.gif
        btnVolver.addEventListener("click", function() {
            ocultarTodosLosGifs();
            contenedorGif2.style.display = "block";
        });


        /* =====================================
           VERIFICACIONES DE ORIENTACIÓN
           ===================================== */

        iniciarHistoria();

        window.addEventListener("orientationchange", function() {
            setTimeout(iniciarHistoria, 300);
        });

        window.addEventListener("resize", function() {
            setTimeout(iniciarHistoria, 300);
        });

    </script>


</body>

</html>

</body>

</html>
