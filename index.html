<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Nuestra historia</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a0512;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* ==================================================
           PANTALLA PARA GIRAR EL TELÉFONO
           ================================================== */

        #aviso-orientacion {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #0a0512;
            color: white;

            text-align: center;
        }

        .telefono-contenedor {
            position: relative;

            width: 90px;
            height: 155px;

            margin-bottom: 35px;

            animation: girarTelefono 2.5s ease-in-out infinite;
        }

        .telefono {
            width: 90px;
            height: 155px;

            border: 5px solid white;
            border-radius: 18px;

            position: relative;
        }

        .telefono::before {
            content: "";

            position: absolute;

            top: 8px;
            left: 50%;

            transform: translateX(-50%);

            width: 28px;
            height: 4px;

            border-radius: 5px;

            background: white;
        }

        .telefono::after {
            content: "";

            position: absolute;

            bottom: 8px;
            left: 50%;

            transform: translateX(-50%);

            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: white;
        }

        #aviso-orientacion h1 {
            margin: 0 0 12px;

            font-size: clamp(25px, 6vw, 42px);
            font-weight: bold;
        }

        #aviso-orientacion p {
            margin: 0;

            font-size: clamp(16px, 4vw, 24px);
            opacity: 0.85;
        }

        @keyframes girarTelefono {
            0% {
                transform: rotate(0deg);
            }

            35% {
                transform: rotate(0deg);
            }

            65% {
                transform: rotate(90deg);
            }

            100% {
                transform: rotate(90deg);
            }
        }


        /* ==================================================
           CONTENIDO PRINCIPAL
           ================================================== */

        #contenido {
            position: fixed;
            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            background: #0a0512;
        }


        /* ==================================================
           MARCO 16:9
           ================================================== */

        #marco-historia {
            position: relative;

            width: min(100vw, 177.7777778vh);
            height: min(56.25vw, 100vh);

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background: #0a0512;

            touch-action: manipulation;

            user-select: none;
            -webkit-user-select: none;
        }


        /* ==================================================
           GIFS
           ================================================== */

        .gif-inicio {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            display: none;

            background: #0a0512;

            pointer-events: none;

            user-select: none;
            -webkit-user-select: none;
        }

        .gif-inicio.activo {
            display: block;
        }


        /* ==================================================
           INDICADOR DE CARGA
           ================================================== */

        #cargando {
            position: fixed;
            inset: 0;

            z-index: 2000;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0a0512;

            color: white;

            font-size: 18px;
        }


        /* ==================================================
           ORIENTACIÓN
           ================================================== */

        @media (orientation: portrait) {

            #aviso-orientacion {
                display: flex;
            }

            #contenido {
                display: none;
            }
        }

        @media (orientation: landscape) {

            #aviso-orientacion {
                display: none;
            }

            #contenido {
                display: flex;
            }
        }
    </style>
</head>


<body>


    <!-- ==================================================
         PANTALLA DE CARGA
         ================================================== -->

    <div id="cargando">
        Cargando...
    </div>


    <!-- ==================================================
         MENSAJE PARA GIRAR EL TELÉFONO
         ================================================== -->

    <div id="aviso-orientacion">

        <div class="telefono-contenedor">
            <div class="telefono"></div>
        </div>

        <h1>Gira tu pantalla</h1>

        <p>para comenzar nuestra historia</p>

    </div>


    <!-- ==================================================
         CONTENIDO PRINCIPAL
         ================================================== -->

    <main id="contenido">

        <div id="marco-historia">

            <img
                id="gif-1"
                class="gif-inicio"
                src="./img/1-.gif"
                alt="Nuestra historia"
            >

            <img
                id="gif-2"
                class="gif-inicio"
                src="./img/2-.gif"
                alt="Menú principal"
            >

            <img
                id="gif-3"
                class="gif-inicio"
                src="./img/3-.gif"
                alt="Salir"
            >

            <img
                id="gif-4"
                class="gif-inicio"
                src="./img/4-.gif"
                alt="Iniciar partida"
            >

        </div>

    </main>


    <script>

        /* ==================================================
           ELEMENTOS
           ================================================== */

        const marco = document.getElementById("marco-historia");

        const gif1 = document.getElementById("gif-1");
        const gif2 = document.getElementById("gif-2");
        const gif3 = document.getElementById("gif-3");
        const gif4 = document.getElementById("gif-4");

        const cargando = document.getElementById("cargando");


        /* ==================================================
           ESCENA ACTUAL
           ================================================== */

        let escenaActual = null;

        let temporizadorGif1 = null;


        /* ==================================================
           MOSTRAR UNA ESCENA
           ================================================== */

        function mostrarEscena(escena) {

            gif1.classList.remove("activo");
            gif2.classList.remove("activo");
            gif3.classList.remove("activo");
            gif4.classList.remove("activo");

            if (escena === "gif-1") {
                gif1.classList.add("activo");
            }

            if (escena === "gif-2") {
                gif2.classList.add("activo");
            }

            if (escena === "gif-3") {
                gif3.classList.add("activo");
            }

            if (escena === "gif-4") {
                gif4.classList.add("activo");
            }

            escenaActual = escena;

            console.log("Escena actual:", escenaActual);
        }


        /* ==================================================
           CUANDO LOS GIFS TERMINEN DE CARGAR
           ================================================== */

        const imagenes = [gif1, gif2, gif3, gif4];

        let imagenesCargadas = 0;

        imagenes.forEach((imagen) => {

            if (imagen.complete) {

                imagenesCargadas++;

            } else {

                imagen.addEventListener("load", () => {

                    imagenesCargadas++;

                    if (imagenesCargadas === imagenes.length) {
                        iniciarHistoria();
                    }

                });

            }

        });


        /* ==================================================
           INICIAR HISTORIA
           ================================================== */

        function iniciarHistoria() {

            cargando.style.display = "none";

            /*
             * Comenzamos mostrando el GIF 1.
             */

            mostrarEscena("gif-1");


            /*
             * Después de EXACTAMENTE 5 segundos
             * pasamos al GIF 2.
             */

            clearTimeout(temporizadorGif1);

            temporizadorGif1 = setTimeout(() => {

                mostrarEscena("gif-2");

            }, 5000);
        }


        /*
         * Si las imágenes ya estaban cargadas cuando
         * se ejecutó el código.
         */

        if (imagenesCargadas === imagenes.length) {
            iniciarHistoria();
        }


        /* ==================================================
           DETECTAR TOQUES / CLICS
           ================================================== */

        marco.addEventListener("pointerdown", function(event) {

            /*
             * Evitamos comportamientos extraños del navegador.
             */

            event.preventDefault();


            /*
             * Obtenemos el tamaño REAL del marco
             * que se está mostrando en pantalla.
             */

            const rect = marco.getBoundingClientRect();


            /*
             * Coordenada del toque dentro del marco.
             */

            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;


            /*
             * Convertimos la posición de pantalla
             * a las coordenadas originales del GIF:
             *
             * 1920 × 1080
             */

            const x1920 = (x / rect.width) * 1920;
            const y1080 = (y / rect.height) * 1080;


            console.log(
                "Toque:",
                Math.round(x1920),
                Math.round(y1080),
                "Escena:",
                escenaActual
            );


            /* ==================================================
               GIF 2
               ================================================== */

            if (escenaActual === "gif-2") {

                /*
                 * INICIAR PARTIDA
                 *
                 * Zona aproximada:
                 * X: 680 - 1290
                 * Y: 620 - 730
                 */

                if (
                    x1920 >= 680 &&
                    x1920 <= 1290 &&
                    y1080 >= 620 &&
                    y1080 <= 730
                ) {

                    console.log("INICIAR PARTIDA");

                    mostrarEscena("gif-4");

                    return;
                }


                /*
                 * SALIR
                 *
                 * Zona:
                 * X: 680 - 970
                 * Y: 700 - 810
                 */

                if (
                    x1920 >= 680 &&
                    x1920 <= 970 &&
                    y1080 >= 700 &&
                    y1080 <= 810
                ) {

                    console.log("SALIR");

                    mostrarEscena("gif-3");

                    return;
                }
            }


            /* ==================================================
               GIF 3
               ================================================== */

            if (escenaActual === "gif-3") {

                /*
                 * VOLVER AL INICIO
                 *
                 * Zona:
                 * X: 480 - 1120
                 * Y: 620 - 735
                 */

                if (
                    x1920 >= 480 &&
                    x1920 <= 1120 &&
                    y1080 >= 620 &&
                    y1080 <= 735
                ) {

                    console.log("VOLVER AL INICIO");

                    mostrarEscena("gif-2");

                    return;
                }
            }


            /* ==================================================
               GIF 4
               ================================================== */

            if (escenaActual === "gif-4") {

                /*
                 * PLAY
                 *
                 * Zona:
                 * X: 650 - 1050
                 * Y: 830 - 1010
                 */

                if (
                    x1920 >= 650 &&
                    x1920 <= 1050 &&
                    y1080 >= 830 &&
                    y1080 <= 1010
                ) {

                    console.log("PLAY");

                    /*
                     * POR AHORA NO CAMBIAMOS DE ESCENA.
                     *
                     * Aquí posteriormente colocaremos
                     * lo que quieres que ocurra al tocar PLAY.
                     */

                    return;
                }
            }

        }, { passive: false });


        /* ==================================================
           EVITAR ZOOM / GESTOS DEL NAVEGADOR
           ================================================== */

        document.addEventListener("gesturestart", function(event) {
            event.preventDefault();
        });

        document.addEventListener("gesturechange", function(event) {
            event.preventDefault();
        });

        document.addEventListener("gestureend", function(event) {
            event.preventDefault();
        });


    </script>

</body>
</html>
