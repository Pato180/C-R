<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Nuestra historia</title>


    <style>

        /* ==================================================
           CONFIGURACIÓN GENERAL
           ================================================== */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #0a0512;
        }


        body {
            font-family: Arial, sans-serif;
        }


        /* ==================================================
           PANTALLA "GIRA TU PANTALLA"
           ================================================== */

        #aviso-orientacion {

            position: fixed;
            inset: 0;

            z-index: 1000;

            display: none;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #0a0512;

            color: white;

            text-align: center;
        }


        /* Teléfono animado */

        .telefono-contenedor {

            position: relative;

            width: 90px;
            height: 155px;

            margin-bottom: 35px;

            animation:
                girarTelefono
                2.5s
                ease-in-out
                infinite;
        }


        .telefono {

            width: 90px;
            height: 155px;

            border: 5px solid white;

            border-radius: 18px;

            position: relative;
        }


        .telefono::before {

            content: "";

            position: absolute;

            top: 8px;
            left: 50%;

            transform: translateX(-50%);

            width: 28px;
            height: 4px;

            border-radius: 5px;

            background: white;
        }


        .telefono::after {

            content: "";

            position: absolute;

            bottom: 8px;
            left: 50%;

            transform: translateX(-50%);

            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: white;
        }


        #aviso-orientacion h1 {

            margin: 0 0 12px;

            font-size: clamp(25px, 6vw, 42px);

            font-weight: bold;
        }


        #aviso-orientacion p {

            margin: 0;

            font-size: clamp(16px, 4vw, 24px);

            opacity: 0.85;
        }


        @keyframes girarTelefono {

            0% {
                transform: rotate(0deg);
            }

            35% {
                transform: rotate(0deg);
            }

            65% {
                transform: rotate(90deg);
            }

            100% {
                transform: rotate(90deg);
            }
        }


        /* ==================================================
           CONTENIDO PRINCIPAL
           ================================================== */

        #contenido {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            background: #0a0512;
        }


        /* ==================================================
           MARCO 16:9
           ================================================== */

        #marco-historia {

            position: relative;

            width: min(100vw, 177.7777778vh);

            height: min(56.25vw, 100vh);

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background: #0a0512;

            touch-action: manipulation;

            user-select: none;

            -webkit-user-select: none;
        }


        /* ==================================================
           GIFS
           ================================================== */

        .gif-inicio {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            /*
             * Mantiene la proporción original
             * de los GIF 1920 x 1080.
             */

            object-fit: contain;

            display: none;

            background: #0a0512;

            /*
             * El GIF no recibe directamente el toque.
             * El toque lo recibe #marco-historia.
             */

            pointer-events: none;

            user-select: none;

            -webkit-user-select: none;
        }


        .gif-inicio.activo {
            display: block;
        }


        /* ==================================================
           PANTALLA DE CARGA
           ================================================== */

        #cargando {

            position: fixed;

            inset: 0;

            z-index: 2000;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #0a0512;

            color: white;

            font-size: 18px;
        }


        /* ==================================================
           ORIENTACIÓN
           ================================================== */

        @media (orientation: portrait) {

            #aviso-orientacion {
                display: flex;
            }

            #contenido {
                display: none;
            }
        }


        @media (orientation: landscape) {

            #aviso-orientacion {
                display: none;
            }

            #contenido {
                display: flex;
            }
        }

    </style>

</head>


<body>


    <!-- ==================================================
         PANTALLA DE CARGA
         ================================================== -->

    <div id="cargando">

        Cargando...

    </div>


    <!-- ==================================================
         PANTALLA PARA GIRAR EL TELÉFONO
         ================================================== -->

    <div id="aviso-orientacion">

        <div class="telefono-contenedor">

            <div class="telefono"></div>

        </div>


        <h1>
            Gira tu pantalla
        </h1>


        <p>
            para comenzar nuestra historia
        </p>

    </div>


    <!-- ==================================================
         HISTORIA
         ================================================== -->

    <main id="contenido">

        <div id="marco-historia">


            <!-- ==================================================
                 GIF 1
                 ================================================== -->

            <img
                id="gif-1"
                class="gif-inicio"
                src="./img/1-.gif"
                alt="Nuestra historia"
            >


            <!-- ==================================================
                 GIF 2
                 ================================================== -->

            <img
                id="gif-2"
                class="gif-inicio"
                src="./img/2-.gif"
                alt="Menú principal"
            >


            <!-- ==================================================
                 GIF 3
                 ================================================== -->

            <img
                id="gif-3"
                class="gif-inicio"
                src="./img/3-.gif"
                alt="Salir"
            >


            <!-- ==================================================
                 GIF 4
                 ================================================== -->

            <img
                id="gif-4"
                class="gif-inicio"
                src="./img/4-.gif"
                alt="Iniciar partida"
            >


            <!-- ==================================================
                 GIF 5
                 ================================================== -->

            <img
                id="gif-5"
                class="gif-inicio"
                src="./img/5-.gif"
                alt="Opciones"
            >


            <!-- ==================================================
                 GIF 6
                 ================================================== -->

            <img
                id="gif-6"
                class="gif-inicio"
                src="./img/6-.gif"
                alt="Cartita"
            >


            <!-- ==================================================
                 GIF 7
                 ================================================== -->

            <img
                id="gif-7"
                class="gif-inicio"
                src="./img/7-.gif"
                alt="Cartita abierta"
            >


            <!-- ==================================================
                 GIF 13
                 ================================================== -->

            <img
                id="gif-13"
                class="gif-inicio"
                src="./img/13-.gif"
                alt="Sorpresa"
            >


            <!-- ==================================================
                 GIF 14
                 ================================================== -->

            <img
                id="gif-14"
                class="gif-inicio"
                src="./img/14-.gif"
                alt="Sorpresa abierta"
            >


            <!-- ==================================================
                 GIF 18
                 ================================================== -->

            <img
                id="gif-18"
                class="gif-inicio"
                src="./img/18-.gif"
                alt="Carrusel"
            >


            <!-- ==================================================
                 GIF 19
                 ================================================== -->

            <img
                id="gif-19"
                class="gif-inicio"
                src="./img/19-.gif"
                alt="Carrusel abierto"
            >


        </div>

    </main>


    <script>


        /* ==================================================
           ELEMENTOS
           ================================================== */

        const marco =
            document.getElementById("marco-historia");


        const gif1 =
            document.getElementById("gif-1");


        const gif2 =
            document.getElementById("gif-2");


        const gif3 =
            document.getElementById("gif-3");


        const gif4 =
            document.getElementById("gif-4");


        const gif5 =
            document.getElementById("gif-5");


        const gif6 =
            document.getElementById("gif-6");


        const gif7 =
            document.getElementById("gif-7");


        const gif13 =
            document.getElementById("gif-13");


        const gif14 =
            document.getElementById("gif-14");


        const gif18 =
            document.getElementById("gif-18");


        const gif19 =
            document.getElementById("gif-19");


        const cargando =
            document.getElementById("cargando");


        /* ==================================================
           ESCENA ACTUAL
           ================================================== */

        let escenaActual = null;


        let temporizadorGif1 = null;


        /* ==================================================
           MOSTRAR UNA ESCENA
           ================================================== */

        function mostrarEscena(escena) {


            /*
             * Ocultamos TODOS los GIF.
             */

            gif1.classList.remove("activo");

            gif2.classList.remove("activo");

            gif3.classList.remove("activo");

            gif4.classList.remove("activo");

            gif5.classList.remove("activo");

            gif6.classList.remove("activo");

            gif7.classList.remove("activo");

            gif13.classList.remove("activo");

            gif14.classList.remove("activo");

            gif18.classList.remove("activo");

            gif19.classList.remove("activo");


            /*
             * Mostramos únicamente
             * la escena correspondiente.
             */

            if (escena === "gif-1") {
                gif1.classList.add("activo");
            }


            if (escena === "gif-2") {
                gif2.classList.add("activo");
            }


            if (escena === "gif-3") {
                gif3.classList.add("activo");
            }


            if (escena === "gif-4") {
                gif4.classList.add("activo");
            }


            if (escena === "gif-5") {
                gif5.classList.add("activo");
            }


            if (escena === "gif-6") {
                gif6.classList.add("activo");
            }


            if (escena === "gif-7") {
                gif7.classList.add("activo");
            }


            if (escena === "gif-13") {
                gif13.classList.add("activo");
            }


            if (escena === "gif-14") {
                gif14.classList.add("activo");
            }


            if (escena === "gif-18") {
                gif18.classList.add("activo");
            }


            if (escena === "gif-19") {
                gif19.classList.add("activo");
            }


            /*
             * Guardamos cuál es la escena actual.
             */

            escenaActual = escena;


            console.log(
                "Escena actual:",
                escenaActual
            );

        }


        /* ==================================================
           CARGA DE IMÁGENES
           ================================================== */

        const imagenes = [

            gif1,
            gif2,
            gif3,
            gif4,
            gif5,

            gif6,
            gif7,

            gif13,
            gif14,

            gif18,
            gif19

        ];


        let imagenesCargadas = 0;


        imagenes.forEach((imagen) => {


            if (imagen.complete) {

                imagenesCargadas++;

            }

            else {

                imagen.addEventListener(
                    "load",
                    () => {

                        imagenesCargadas++;


                        if (
                            imagenesCargadas ===
                            imagenes.length
                        ) {

                            iniciarHistoria();

                        }

                    }
                );

            }

        });


        /* ==================================================
           INICIAR HISTORIA
           ================================================== */

        function iniciarHistoria() {


            /*
             * Quitamos la pantalla de carga.
             */

            cargando.style.display = "none";


            /*
             * Comenzamos con GIF 1.
             */

            mostrarEscena("gif-1");


            /*
             * Después de 5 segundos
             * pasamos automáticamente
             * al GIF 2.
             */

            clearTimeout(temporizadorGif1);


            temporizadorGif1 =
                setTimeout(
                    () => {

                        mostrarEscena("gif-2");

                    },
                    5000
                );

        }


        /*
         * Si todas las imágenes
         * ya estaban cargadas.
         */

        if (
            imagenesCargadas ===
            imagenes.length
        ) {

            iniciarHistoria();

        }


        /* ==================================================
           DETECTAR TOQUES
           ================================================== */

        marco.addEventListener(

            "pointerdown",

            function(event) {


                /*
                 * Evitamos que el navegador
                 * haga zoom o algún gesto.
                 */

                event.preventDefault();


                /*
                 * Obtenemos el tamaño real
                 * del marco en pantalla.
                 */

                const rect =
                    marco.getBoundingClientRect();


                /*
                 * Posición del toque
                 * dentro del marco.
                 */

                const x =
                    event.clientX -
                    rect.left;


                const y =
                    event.clientY -
                    rect.top;


                /*
                 * Convertimos la posición
                 * a las coordenadas originales
                 * de los GIF:
                 *
                 * 1920 x 1080
                 */

                const x1920 =
                    (x / rect.width) *
                    1920;


                const y1080 =
                    (y / rect.height) *
                    1080;


                console.log(
                    "Toque:",
                    Math.round(x1920),
                    Math.round(y1080),
                    "Escena:",
                    escenaActual
                );


                /* ==================================================
                   GIF 2 — MENÚ PRINCIPAL
                   ================================================== */

                if (
                    escenaActual ===
                    "gif-2"
                ) {


                    /*
                     * INICIAR PARTIDA
                     *
                     * Zona:
                     *
                     * X: 680 - 1290
                     * Y: 620 - 730
                     */

                    if (

                        x1920 >= 680 &&

                        x1920 <= 1290 &&

                        y1080 >= 620 &&

                        y1080 <= 730

                    ) {


                        console.log(
                            "INICIAR PARTIDA"
                        );


                        mostrarEscena(
                            "gif-4"
                        );


                        return;

                    }


                    /*
                     * SALIR
                     *
                     * Zona:
                     *
                     * X: 680 - 970
                     * Y: 700 - 810
                     */

                    if (

                        x1920 >= 680 &&

                        x1920 <= 970 &&

                        y1080 >= 700 &&

                        y1080 <= 810

                    ) {


                        console.log(
                            "SALIR"
                        );


                        mostrarEscena(
                            "gif-3"
                        );


                        return;

                    }

                }


                /* ==================================================
                   GIF 3 — VOLVER AL INICIO
                   ================================================== */

                if (
                    escenaActual ===
                    "gif-3"
                ) {


                    /*
                     * VOLVER AL INICIO
                     *
                     * Zona:
                     *
                     * X: 480 - 1120
                     * Y: 620 - 735
                     */

                    if (

                        x1920 >= 480 &&

                        x1920 <= 1120 &&

                        y1080 >= 620 &&

                        y1080 <= 735

                    ) {


                        console.log(
                            "VOLVER AL INICIO"
                        );


                        mostrarEscena(
                            "gif-2"
                        );


                        return;

                    }

                }


                /* ==================================================
                   GIF 4 — PLAY
                   ================================================== */

                if (
                    escenaActual ===
                    "gif-4"
                ) {


                    /*
                     * PLAY
                     *
                     * Zona:
                     *
                     * X: 650 - 1050
                     * Y: 830 - 1010
                     */

                    if (

                        x1920 >= 650 &&

                        x1920 <= 1050 &&

                        y1080 >= 830 &&

                        y1080 <= 1010

                    ) {


                        console.log(
                            "PLAY"
                        );


                        /*
                         * Al tocar PLAY:
                         *
                         * GIF 4
                         * ↓
                         * GIF 5
                         */

                        mostrarEscena(
                            "gif-5"
                        );


                        return;

                    }

                }


                /* ==================================================
                   GIF 5 — OPCIONES
                   ================================================== */

                if (
                    escenaActual ===
                    "gif-5"
                ) {


                    /*
                     * CARTITA
                     *
                     * Zona:
                     *
                     * X: 255 - 565
                     * Y: 670 - 795
                     *
                     * GIF 5
                     * ↓
                     * GIF 6
                     */

                    if (

                        x1920 >= 255 &&

                        x1920 <= 565 &&

                        y1080 >= 670 &&

                        y1080 <= 795

                    ) {


                        console.log(
                            "CARTITA"
                        );


                        mostrarEscena(
                            "gif-6"
                        );


                        return;

                    }


                    /*
                     * SORPRESA
                     *
                     * Zona:
                     *
                     * X: 810 - 1120
                     * Y: 670 - 795
                     *
                     * GIF 5
                     * ↓
                     * GIF 13
                     */

                    if (

                        x1920 >= 810 &&

                        x1920 <= 1120 &&

                        y1080 >= 670 &&

                        y1080 <= 795

                    ) {


                        console.log(
                            "SORPRESA"
                        );


                        mostrarEscena(
                            "gif-13"
                        );


                        return;

                    }


                    /*
                     * CARRUSEL
                     *
                     * Zona:
                     *
                     * X: 1365 - 1675
                     * Y: 670 - 795
                     *
                     * GIF 5
                     * ↓
                     * GIF 18
                     */

                    if (

                        x1920 >= 1365 &&

                        x1920 <= 1675 &&

                        y1080 >= 670 &&

                        y1080 <= 795

                    ) {


                        console.log(
                            "CARRUSEL"
                        );


                        mostrarEscena(
                            "gif-18"
                        );


                        return;

                    }

                }


                /* ==================================================
                   GIF 6 — ABRIR CARTITA
                   ================================================== */

                if (
                    escenaActual ===
                    "gif-6"
                ) {


                    /*
                     * ABRIR
                     *
                     * Zona:
                     *
                     * X: 780 - 1090
                     * Y: 745 - 870
                     *
                     * GIF 6
                     * ↓
                     * GIF 7
                     */

                    if (

                        x1920 >= 780 &&

                        x1920 <= 1090 &&

                        y1080 >= 745 &&

                        y1080 <= 870

                    ) {


                        console.log(
                            "ABRIR CARTITA"
                        );


                        mostrarEscena(
                            "gif-7"
                        );


                        return;

                    }

                }


                /* ==================================================
                   GIF 13 — SORPRESA
                   ================================================== */

                if (
                    escenaActual ===
                    "gif-13"
                ) {


                    /*
                     * BOTÓN SORPRESA
                     *
                     * Zona:
                     *
                     * X: 810 - 1120
                     * Y: 725 - 850
                     *
                     * GIF 13
                     * ↓
                     * GIF 14
                     */

                    if (

                        x1920 >= 810 &&

                        x1920 <= 1120 &&

                        y1080 >= 725 &&

                        y1080 <= 850

                    ) {


                        console.log(
                            "SORPRESA (GIF 13)"
                        );


                        mostrarEscena(
                            "gif-14"
                        );


                        return;

                    }

                }


                /* ==================================================
                   GIF 18 — CARRUSEL
                   ================================================== */

                if (
                    escenaActual ===
                    "gif-18"
                ) {


                    /*
                     * BOTÓN CARRUSEL
                     *
                     * Zona:
                     *
                     * X: 860 - 1170
                     * Y: 730 - 855
                     *
                     * GIF 18
                     * ↓
                     * GIF 19
                     */

                    if (

                        x1920 >= 860 &&

                        x1920 <= 1170 &&

                        y1080 >= 730 &&

                        y1080 <= 855

                    ) {


                        console.log(
                            "CARRUSEL (GIF 18)"
                        );


                        mostrarEscena(
                            "gif-19"
                        );


                        return;

                    }

                }


                /* ==================================================
                   GIF 7 — SIN ACCIÓN POR AHORA
                   ================================================== */

                if (
                    escenaActual ===
                    "gif-7"
                ) {

                    console.log(
                        "GIF 7 — sin acción"
                    );

                    return;

                }


                /* ==================================================
                   GIF 14 — SIN ACCIÓN POR AHORA
                   ================================================== */

                if (
                    escenaActual ===
                    "gif-14"
                ) {

                    console.log(
                        "GIF 14 — sin acción"
                    );

                    return;

                }


                /* ==================================================
                   GIF 19 — SIN ACCIÓN POR AHORA
                   ================================================== */

                if (
                    escenaActual ===
                    "gif-19"
                ) {

                    console.log(
                        "GIF 19 — sin acción"
                    );

                    return;

                }


            },

            {
                passive: false
            }

        );


        /* ==================================================
           EVITAR GESTOS DEL NAVEGADOR
           ================================================== */

        document.addEventListener(
            "gesturestart",
            function(event) {

                event.preventDefault();

            }
        );


        document.addEventListener(
            "gesturechange",
            function(event) {

                event.preventDefault();

            }
        );


        document.addEventListener(
            "gestureend",
            function(event) {

                event.preventDefault();

            }
        );


    </script>

</body>

</html>
