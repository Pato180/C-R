<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Nuestra historia</title>

    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0512;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }


        /* =========================
           AVISO DE GIRAR PANTALLA
           ========================= */

        #aviso-orientacion {
            position: fixed;
            inset: 0;

            display: none;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 28px;

            padding: 30px;

            background:
                radial-gradient(
                    circle at center,
                    #211232 0%,
                    #0a0512 70%
                );

            color: #f4eafa;

            text-align: center;

            z-index: 9999;
        }


        /* =========================
           TELÉFONO ANIMADO
           ========================= */

        .telefono-contenedor {
            width: 90px;
            height: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            animation: girar-telefono 2.5s ease-in-out infinite;
        }


        .telefono {
            width: 58px;
            height: 100px;

            border: 3px solid #a06fd6;
            border-radius: 12px;

            position: relative;

            box-shadow:
                0 0 15px rgba(160, 111, 214, 0.5),
                inset 0 0 10px rgba(160, 111, 214, 0.15);
        }


        /* Cámara / altavoz */

        .telefono::before {
            content: "";

            position: absolute;

            top: 7px;
            left: 50%;

            transform: translateX(-50%);

            width: 18px;
            height: 4px;

            border-radius: 10px;

            background: #a06fd6;
        }


        /* Botón inferior */

        .telefono::after {
            content: "";

            position: absolute;

            bottom: 7px;
            left: 50%;

            transform: translateX(-50%);

            width: 7px;
            height: 7px;

            border-radius: 50%;

            border: 1px solid #a06fd6;
        }


        @keyframes girar-telefono {

            0% {
                transform: rotate(0deg);
            }

            35% {
                transform: rotate(0deg);
            }

            65% {
                transform: rotate(90deg);
            }

            100% {
                transform: rotate(90deg);
            }

        }


        /* =========================
           TEXTO
           ========================= */

        .titulo-orientacion {
            font-size: clamp(22px, 6vw, 32px);

            font-weight: bold;

            letter-spacing: 1px;

            color: #ffffff;
        }


        .subtitulo-orientacion {
            margin-top: 8px;

            font-size: clamp(14px, 4vw, 18px);

            line-height: 1.5;

            color: rgba(244, 234, 250, 0.65);
        }


        /* =========================
           CONTENIDO PRINCIPAL
           ========================= */

        #contenido {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* =========================
           SOLO EN CELULAR VERTICAL
           ========================= */

        @media (orientation: portrait) and (max-width: 900px) {

            #aviso-orientacion {
                display: flex;
            }

            #contenido {
                display: none;
            }

        }


        /* =========================
           EN HORIZONTAL
           ========================= */

        @media (orientation: landscape) {

            #aviso-orientacion {
                display: none;
            }

            #contenido {
                display: flex;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================
         AVISO DE GIRAR LA PANTALLA
         ===================================== -->

    <div id="aviso-orientacion">

        <div class="telefono-contenedor">

            <div class="telefono"></div>

        </div>


        <div>

            <div class="titulo-orientacion">
                Gira tu pantalla
            </div>

            <div class="subtitulo-orientacion">
                para comenzar nuestra historia
            </div>

        </div>

    </div>
