<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosotros</title>
<style>
  :root{
    --morado:#a06fd6;
    --turquesa:#4fd1c5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:#000;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---- contenedor 16:9 que se adapta a cualquier pantalla ---- */
  #juego{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  #marco{
    position:relative;
    width:100%; max-width:calc(177.78vh);
    aspect-ratio:16/9;
    max-height:100%;
    overflow:hidden;
    background:#000;
    transition:opacity .5s ease;
  }
  #marco.fundido{opacity:0;}

  #fondo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    display:block;
  }

  /* ---- pantalla de texto automática (sin imagen) ---- */
  #texto-auto{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    text-align:center;
    padding:10%;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(160,111,214,.35), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(79,209,197,.35), transparent 55%),
      linear-gradient(160deg,#0a0512 0%,#160c26 50%,#0d1f24 100%);
  }
  #texto-auto.visible{display:flex;}
  #texto-auto p{
    color:#f2ecfa;
    font-style:italic;
    font-size:clamp(16px, 3vw, 32px);
    line-height:1.6;
    text-shadow:0 0 14px rgba(160,111,214,.5);
  }

  /* ---- botones invisibles sobre las imágenes ---- */
  .hitbox{
    position:absolute;
    cursor:pointer;
    background:rgba(255,0,0,0);      /* invisible en producción */
    border:2px solid rgba(255,0,0,0); /* invisible en producción */
  }
  body.debug .hitbox{
    background:rgba(255,60,60,.25);
    border:2px solid rgba(255,60,60,.8);
  }

  /* ---- aviso de girar el teléfono (solo 5 segundos) ---- */
  #girar{
    position:fixed; inset:0;
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    gap:24px;
    background:#0a0512;
    color:#e8dcf5;
    text-align:center;
    padding:32px;
    font-size:18px;
    z-index:99;
    transition:opacity .4s ease;
  }
  #girar.mostrar{display:flex;}
  #girar svg{animation:girarIcono 2s ease-in-out infinite;}
  @keyframes girarIcono{
    0%,40%{transform:rotate(0);}
    60%,100%{transform:rotate(-90deg);}
  }
</style>
</head>
<body>

<!-- ============ AVISO DE ORIENTACIÓN (5 segundos) ============ -->
<div id="girar">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#a06fd6" stroke-width="1.6">
    <rect x="7" y="2" width="10" height="20" rx="2"/>
    <line x1="10" y1="19" x2="14" y2="19"/>
  </svg>
  <div>Gira tu pantalla<br><span style="opacity:.6;font-size:15px;">para ver esta historia</span></div>
</div>

<!-- ============ JUEGO ============ -->
<div id="juego">
  <div id="marco">
    <img id="fondo" alt="" style="display:none;">
    <div id="texto-auto"><p id="texto-auto-p"></p></div>
    <div id="capa-botones"></div>
  </div>
</div>

<script>
/* ==========================================================
   PARA ACTIVAR EL MODO DE CALIBRACIÓN (ver los botones en rojo
   mientras ajustas las posiciones), cambia esta línea a true.
   Déjala en false antes de publicar la versión final.
   ========================================================== */
const DEBUG_BOTONES = false;
if(DEBUG_BOTONES) document.body.classList.add('debug');

/* ==========================================================
   AQUÍ EDITAS TODO. Cada objeto es una pantalla.

   tipo:"auto"
     texto     -> el texto que aparece (editable)
     duracion  -> milisegundos que permanece antes de avanzar sola
     ir        -> índice de la escena a la que salta

   tipo:"espera"
     img       -> ruta de la imagen (debe ser 1920x1080)
     botones   -> lista de zonas invisibles clicables:
                  { top, left, width, height }  <- en % de la imagen
                  ir -> índice de la escena a la que salta al tocar ahí
   ========================================================== */

const ESCENAS = [

  // 0 — Pantalla de bienvenida (7 segundos, sin imagen)
  {
    tipo:"auto",
    texto:"Este juego fue hecho con mucho amor para ti. Espero que te guste. 💜",
    duracion:7000,
    ir:1
  },

  // 1 — Menú principal: "Feliz cumple mes, mi vida"
  {
    tipo:"espera",
    img:"img/menu-inicio.png",
    botones:[
      // INICIAR PARTIDA
      { top:59.0, left:38.5, width:27.0, height:5.0, ir:3 },
      // SALIR
      { top:64.5, left:38.5, width:10.5, height:5.0, ir:2 }
    ]
  },

  // 2 — Pantalla de salida ("Intenta jugarlo por fis...")
  {
    tipo:"espera",
    img:"img/menu-salir.png",
    botones:[
      // VOLVER AL INICIO -> regresa a la pantalla de bienvenida (índice 0)
      { top:58.5, left:27.0, width:29.5, height:5.5, ir:0 }
    ]
  },

  // 3 — "Holi, mi amor..." con botón PLAY
  {
    tipo:"espera",
    img:"img/menu-play.png",
    botones:[
      // PLAY
      { top:79.5, left:36.5, width:13.0, height:10.0, ir:4 }
    ]
  },

  // 4 — Menú de tres opciones: Cartita / Sorpresa / Carrusel
  {
    tipo:"espera",
    img:"img/menu-opciones.png",
    botones:[
      { top:68.5, left:13.0, width:15.0, height:7.5, ir:5 }, // Cartita
      { top:68.5, left:42.5, width:14.5, height:7.5, ir:6 }, // Sorpresa
      { top:68.5, left:71.5, width:14.5, height:7.5, ir:7 }  // Carrusel
    ]
  },

  // 5, 6, 7 — Placeholders: aquí conectamos cada opción a su contenido
  {
    tipo:"auto",
    texto:"(Aquí va el contenido de \"Cartita\" — pendiente)",
    duracion:99999999,
    ir:4
  },
  {
    tipo:"auto",
    texto:"(Aquí va el contenido de \"Sorpresa\" — pendiente)",
    duracion:99999999,
    ir:4
  },
  {
    tipo:"auto",
    texto:"(Aquí va el contenido de \"Carrusel\" — pendiente)",
    duracion:99999999,
    ir:4
  }

];

/* ==========================================================
   MOTOR — normalmente no necesitas tocar nada de aquí abajo
   ========================================================== */

let actual = 0;
let bloqueado = false;
let temporizador = null;

const marco   = document.getElementById('marco');
const fondo   = document.getElementById('fondo');
const textoAuto = document.getElementById('texto-auto');
const textoAutoP = document.getElementById('texto-auto-p');
const capaBotones = document.getElementById('capa-botones');

function pintar(i){
  const e = ESCENAS[i];
  actual = i;

  clearTimeout(temporizador);
  capaBotones.innerHTML = '';
  textoAuto.classList.remove('visible');
  fondo.style.display = 'none';

  if(e.tipo === "auto"){
    textoAutoP.textContent = e.texto;
    textoAuto.classList.add('visible');
    temporizador = setTimeout(()=>ir(e.ir), e.duracion);
    return;
  }

  if(e.tipo === "espera"){
    fondo.src = e.img;
    fondo.style.display = 'block';
    e.botones.forEach(b=>{
      const zona = document.createElement('div');
      zona.className = 'hitbox';
      zona.style.top = b.top + '%';
      zona.style.left = b.left + '%';
      zona.style.width = b.width + '%';
      zona.style.height = b.height + '%';
      zona.onclick = ()=>ir(b.ir);
      capaBotones.appendChild(zona);
    });
  }
}

function ir(i){
  if(bloqueado) return;
  bloqueado = true;
  marco.classList.add('fundido');
  setTimeout(()=>{
    pintar(i);
    marco.classList.remove('fundido');
    bloqueado = false;
  }, 500);
}

// precargar imágenes
ESCENAS.forEach(e=>{ if(e.img){ const im = new Image(); im.src = e.img; }});

pintar(0);

/* ---- aviso de girar pantalla: aparece solo si está en vertical,
        y se oculta solo a los 5 segundos pase lo que pase ---- */
const girar = document.getElementById('girar');
function esVertical(){
  return window.innerHeight > window.innerWidth && window.innerWidth < 900;
}
if(esVertical()){
  girar.classList.add('mostrar');
  setTimeout(()=>girar.classList.remove('mostrar'), 5000);
}
</script>

</body>
</html>
