<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Nuestra historia</title>


    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #0a0512;

            font-family:
                "Trebuchet MS",
                "Segoe UI",
                sans-serif;
        }


        /* =========================
           AVISO DE GIRAR PANTALLA
           ========================= */

        #aviso-orientacion {

            position: fixed;

            inset: 0;

            display: none;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 28px;

            padding: 30px;

            background:
                radial-gradient(
                    circle at center,
                    #211232 0%,
                    #0a0512 70%
                );

            color: #f4eafa;

            text-align: center;

            z-index: 9999;
        }


        /* =========================
           TELÉFONO ANIMADO
           ========================= */

        .telefono-contenedor {

            width: 90px;
            height: 120px;

            display: flex;

            align-items: center;
            justify-content: center;

            animation:
                girar-telefono
                2.5s
                ease-in-out
                infinite;
        }


        .telefono {

            width: 58px;
            height: 100px;

            border: 3px solid #a06fd6;

            border-radius: 12px;

            position: relative;

            box-shadow:
                0 0 15px rgba(160, 111, 214, 0.5),
                inset 0 0 10px rgba(160, 111, 214, 0.15);
        }


        .telefono::before {

            content: "";

            position: absolute;

            top: 7px;
            left: 50%;

            transform: translateX(-50%);

            width: 18px;
            height: 4px;

            border-radius: 10px;

            background: #a06fd6;
        }


        .telefono::after {

            content: "";

            position: absolute;

            bottom: 7px;
            left: 50%;

            transform: translateX(-50%);

            width: 7px;
            height: 7px;

            border-radius: 50%;

            border: 1px solid #a06fd6;
        }


        @keyframes girar-telefono {

            0% {
                transform: rotate(0deg);
            }

            35% {
                transform: rotate(0deg);
            }

            65% {
                transform: rotate(90deg);
            }

            100% {
                transform: rotate(90deg);
            }

        }


        /* =========================
           TEXTO
           ========================= */

        .titulo-orientacion {

            font-size:
                clamp(22px, 6vw, 32px);

            font-weight: bold;

            letter-spacing: 1px;

            color: #ffffff;
        }


        .subtitulo-orientacion {

            margin-top: 8px;

            font-size:
                clamp(14px, 4vw, 18px);

            line-height: 1.5;

            color:
                rgba(244, 234, 250, 0.65);
        }


        /* =========================
           CONTENIDO
           ========================= */

        #contenido {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* =========================
           MARCO DE LA HISTORIA
           
           Este marco mantiene siempre
           la proporción 1920 × 1080.
           ========================= */

        #marco-historia {

            position: relative;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        /* =========================
           GIFS
           ========================= */

        .gif-inicio {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            object-position: center;

            background: #0a0512;

            display: none;

            z-index: 1;
        }


        /* =========================
           CAPA DE BOTONES
           ========================= */

        #capa-botones {

            position: absolute;

            inset: 0;

            z-index: 10;

            pointer-events: none;
        }


        /* =========================
           ZONAS TÁCTILES
           ========================= */

        .zona-tactil {

            position: absolute;

            display: none;

            padding: 0;
            margin: 0;

            border: none;

            background: transparent;

            cursor: pointer;

            pointer-events: auto;

            touch-action: manipulation;
        }


        .zona-tactil.visible {

            display: block;
        }


        /* =========================
           CELULAR VERTICAL
           ========================= */

        @media (orientation: portrait) and (max-width: 900px) {

            #aviso-orientacion {

                display: flex;
            }

            #contenido {

                display: none;
            }

        }


        /* =========================
           PANTALLA HORIZONTAL
           ========================= */

        @media (orientation: landscape) {

            #aviso-orientacion {

                display: none;
            }

            #contenido {

                display: flex;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         AVISO DE GIRAR PANTALLA
         ===================================== -->

    <div id="aviso-orientacion">

        <div class="telefono-contenedor">

            <div class="telefono"></div>

        </div>


        <div>

            <div class="titulo-orientacion">
                Gira tu pantalla
            </div>

            <div class="subtitulo-orientacion">
                para comenzar nuestra historia
            </div>

        </div>

    </div>


    <!-- =====================================
         HISTORIA
         ===================================== -->

    <div id="contenido">

        <div id="marco-historia">


            <!-- =========================
                 GIF 1
                 ========================= -->

            <img
                id="gif-1"
                class="gif-inicio"
                src="./img/1-.gif"
                alt="Nuestra historia"
            >


            <!-- =========================
                 GIF 2
                 ========================= -->

            <img
                id="gif-2"
                class="gif-inicio"
                src="./img/2-.gif"
                alt="Menú principal"
            >


            <!-- =========================
                 GIF 3
                 ========================= -->

            <img
                id="gif-3"
                class="gif-inicio"
                src="./img/3-.gif"
                alt="Salir"
            >


            <!-- =========================
                 GIF 4
                 ========================= -->

            <img
                id="gif-4"
                class="gif-inicio"
                src="./img/4-.gif"
                alt="Iniciar partida"
            >


            <!-- =========================
                 CAPA DE BOTONES
                 ========================= -->

            <div id="capa-botones">


                <!-- INICIAR PARTIDA -->

                <button
                    id="zona-iniciar"
                    class="zona-tactil"
                    aria-label="Iniciar partida">
                </button>


                <!-- SALIR -->

                <button
                    id="zona-salir"
                    class="zona-tactil"
                    aria-label="Salir">
                </button>


                <!-- VOLVER AL INICIO -->

                <button
                    id="zona-volver"
                    class="zona-tactil"
                    aria-label="Volver al inicio">
                </button>


                <!-- PLAY DE GIF 4 -->

                <button
                    id="zona-play"
                    class="zona-tactil"
                    aria-label="Play">
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================
         JAVASCRIPT
         ===================================== -->

    <script>


        /* =========================
           GIFS
           ========================= */

        const gif1 =
            document.getElementById("gif-1");

        const gif2 =
            document.getElementById("gif-2");

        const gif3 =
            document.getElementById("gif-3");

        const gif4 =
            document.getElementById("gif-4");


        /* =========================
           BOTONES
           ========================= */

        const zonaIniciar =
            document.getElementById("zona-iniciar");

        const zonaSalir =
            document.getElementById("zona-salir");

        const zonaVolver =
            document.getElementById("zona-volver");

        const zonaPlay =
            document.getElementById("zona-play");


        /* =========================
           ESTADO
           ========================= */

        let escenaActual = null;

        let historiaIniciada = false;


        /* =========================
           RESOLUCIÓN ORIGINAL
           
           Todos los GIF:
           1920 × 1080
           ========================= */

        const ANCHO_GIF = 1920;

        const ALTO_GIF = 1080;


        /* =========================
           COMPROBAR ORIENTACIÓN
           ========================= */

        function estaHorizontal() {

            return window.matchMedia(
                "(orientation: landscape)"
            ).matches;

        }


        /* =========================
           OCULTAR GIFS
           ========================= */

        function ocultarGifs() {

            gif1.style.display = "none";

            gif2.style.display = "none";

            gif3.style.display = "none";

            gif4.style.display = "none";

        }


        /* =========================
           OCULTAR BOTONES
           ========================= */

        function ocultarZonas() {

            zonaIniciar.classList.remove("visible");

            zonaSalir.classList.remove("visible");

            zonaVolver.classList.remove("visible");

            zonaPlay.classList.remove("visible");

        }


        /* =========================
           MOSTRAR ESCENA
           ========================= */

        function mostrarEscena(id) {

            ocultarGifs();

            ocultarZonas();


            const escena =
                document.getElementById(id);


            if (!escena) {

                return;

            }


            escena.style.display = "block";


            escenaActual = id;


            requestAnimationFrame(function() {

                actualizarZonas();

            });

        }


        /* =========================
           CALCULAR ESCALA
           
           Aquí hacemos que las
           coordenadas de 1920 × 1080
           se adapten exactamente a
           la imagen visible.
           ========================= */

        function calcularAreaImagen() {

            const pantallaAncho =
                window.innerWidth;

            const pantallaAlto =
                window.innerHeight;


            /*
             * "contain":
             * la imagen completa siempre
             * permanece visible.
             */

            const escala =
                Math.min(

                    pantallaAncho / ANCHO_GIF,

                    pantallaAlto / ALTO_GIF

                );


            const ancho =
                ANCHO_GIF * escala;


            const alto =
                ALTO_GIF * escala;


            /*
             * Centrar imagen.
             */

            const izquierda =
                (pantallaAncho - ancho) / 2;


            const arriba =
                (pantallaAlto - alto) / 2;


            return {

                escala: escala,

                izquierda: izquierda,

                arriba: arriba

            };

        }


        /* =========================
           COLOCAR BOTÓN
           ========================= */

        function colocarZona(

            zona,

            x,
            y,

            ancho,

            alto,

            area

        ) {

            const escala =
                area.escala;


            /*
             * Coordenadas de 1920 × 1080
             * convertidas a pantalla.
             */

            zona.style.left =
                (
                    area.izquierda +
                    (x * escala)
                ) + "px";


            zona.style.top =
                (
                    area.arriba +
                    (y * escala)
                ) + "px";


            zona.style.width =
                (ancho * escala) + "px";


            zona.style.height =
                (alto * escala) + "px";


            zona.classList.add("visible");

        }


        /* =========================
           ACTUALIZAR BOTONES
           ========================= */

        function actualizarZonas() {

            ocultarZonas();


            if (!estaHorizontal()) {

                return;

            }


            if (!escenaActual) {

                return;

            }


            const area =
                calcularAreaImagen();


            /* =========================
               GIF 2
               ========================= */

            if (escenaActual === "gif-2") {


                /*
                 * INICIAR PARTIDA
                 *
                 * X: 710
                 * Y: 650
                 * W: 550
                 * H: 55
                 */

                colocarZona(

                    zonaIniciar,

                    710,
                    650,

                    550,
                    55,

                    area

                );


                /*
                 * SALIR
                 *
                 * X: 710
                 * Y: 725
                 * W: 225
                 * H: 55
                 */

                colocarZona(

                    zonaSalir,

                    710,
                    725,

                    225,
                    55,

                    area

                );

            }


            /* =========================
               GIF 3
               ========================= */

            if (escenaActual === "gif-3") {


                /*
                 * VOLVER AL INICIO
                 *
                 * X: 515
                 * Y: 650
                 * W: 570
                 * H: 55
                 */

                colocarZona(

                    zonaVolver,

                    515,
                    650,

                    570,
                    55,

                    area

                );

            }


            /* =========================
               GIF 4
               ========================= */

            if (escenaActual === "gif-4") {


                /*
                 * PLAY
                 *
                 * X: 687
                 * Y: 865
                 * W: 317
                 * H: 110
                 */

                colocarZona(

                    zonaPlay,

                    687,
                    865,

                    317,
                    110,

                    area

                );

            }

        }


        /* =========================
           INICIAR HISTORIA
           ========================= */

        function iniciarHistoria() {

            if (!estaHorizontal()) {

                return;

            }


            if (historiaIniciada) {

                return;

            }


            historiaIniciada = true;


            /*
             * GIF 1
             */

            mostrarEscena("gif-1");


            /*
             * ESPERAR 5 SEGUNDOS
             */

            setTimeout(function() {

                mostrarEscena("gif-2");

            }, 5000);

        }


        /* =========================
           INICIAR PARTIDA
           ========================= */

        zonaIniciar.addEventListener(

            "click",

            function() {

                mostrarEscena("gif-4");

            }

        );


        /* =========================
           SALIR
           ========================= */

        zonaSalir.addEventListener(

            "click",

            function() {

                mostrarEscena("gif-3");

            }

        );


        /* =========================
           VOLVER AL INICIO
           ========================= */

        zonaVolver.addEventListener(

            "click",

            function() {

                mostrarEscena("gif-2");

            }

        );


        /* =========================
           PLAY
           
           Todavía no hacemos nada
           porque falta definir qué
           debe suceder después.
           ========================= */

        zonaPlay.addEventListener(

            "click",

            function() {

                console.log(
                    "PLAY seleccionado"
                );

            }

        );


        /* =========================
           CARGAR HISTORIA
           ========================= */

        iniciarHistoria();


        /* =========================
           CAMBIO DE ORIENTACIÓN
           ========================= */

        window.addEventListener(

            "orientationchange",

            function() {

                setTimeout(

                    function() {

                        iniciarHistoria();

                        actualizarZonas();

                    },

                    300

                );

            }

        );


        /* =========================
           CAMBIO DE TAMAÑO
           ========================= */

        window.addEventListener(

            "resize",

            function() {

                setTimeout(

                    function() {

                        actualizarZonas();

                    },

                    100

                );

            }

        );

    </script>

</body>

</html>
